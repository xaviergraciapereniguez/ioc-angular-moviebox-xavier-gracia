
<form class="filtres" #formulariFiltres="ngForm" (ngSubmit)="aplicaFiltres()" aria-label="Filtres del catàleg de pel·lícules" >
  <div class="camp">
    <label for="cerca-movie">Cerca per títol o descripció</label>

    <input id="cerca-movie" name="text" type="search" [(ngModel)]="filtres.text" #campText="ngModel" minlength="3" placeholder="Opcional, mínim 3 caràcters" aria-describedby="text-ajuda" [attr.aria-invalid]="campText.invalid && (campText.dirty || campText.touched)" [attr.aria-describedby]="campText.invalid && (campText.dirty || campText.touched) ? 'text-ajuda text-error' : 'text-ajuda'" />

    <span id="text-ajuda" class="ajuda"> Opcional: si escriviu text, ha de tenir 3 caràcters com a mínim. Podeu filtrar només per categoria. </span>

    @if (campText.invalid && (campText.dirty || campText.touched)) {
      <strong id="text-error" class="error" role="alert">
        La cerca ha de tenir almenys 3 caràcters.
      </strong>
    }
  </div>

  <div class="camp">
    <label for="categoria-movie">Genere</label>

    <select
      id="categoria-movie"
      name="categoria"
      [(ngModel)]="filtres.categoria"
    >
      @for (categoria of categories; track categoria) {
        <option [ngValue]="categoria">{{ categoria }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button type="submit" [disabled]="formulariFiltres.invalid">
      Aplicar filtres
    </button>

    <button
      type="button"
      class="secundari"
      (click)="restableixFiltres()"
    >
      Restablir
    </button>
  </div>
</form>
